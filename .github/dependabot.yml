version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Keep Python major/minor upgrades explicit; patch and digest updates remain automatic.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      python-images:
        patterns: [python]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
