name: Container checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime image
        run: docker build --pull -t photobot:check .
      - name: Check Dependabot merge gates
        run: node --test tests/check_dependabot.cjs
      - name: Check the built runtime
        run: docker run --rm -i --network none photobot:check python - < tests/check_runtime.py
      - name: Check Telegram photo conversation
        run: docker run --rm -i --network none photobot:check python - < tests/check_telegram.py
